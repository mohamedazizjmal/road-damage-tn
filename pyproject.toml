[project]
name = "road-damage-tn"
version = "0.1.0"
description = "Road damage (pothole/crack) detection for Tunisia: dataset, models, API, demo, damage map."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy",
  "pyyaml",
  "pandas",
  "opencv-python-headless",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit", "httpx"]
train = ["ultralytics", "mlflow"]
geo = ["gpxpy", "geopandas", "shapely", "pyproj", "folium"]
serve = ["fastapi", "uvicorn", "onnxruntime", "python-multipart", "gradio"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
